<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <!--Aqui começa o css-->
    <style> 
       body{ /*Estilo do geral corpo da página*/
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        background-color: #7ddfee; /*Cor de fundo*/
        margin: 20px; /*Espaçamento externo*/
       }

       header { /*Cabeçalho*/
          background-color: rgb(93, 167, 182); /*Cor de fundo*/
          color: black; /*Cor do texto*/
         padding: 20px; /*Espaçamento interno*/
          text-align: center; /*Centraliza o conteúdo*/
       }

       nav a { /* Links de navegação*/
       color: rgb(40, 47, 47); /*Cor dos links*/
       margin: 0 30px; /* Espaçamento lateral*/
       text-decoration: none; /* Remove o sublinhado*/
       font-size: 20px;   /* Tamanho da fonte*/
       }

       nav a:hover { /* Quando o mouse passa sobre o link*/
        text-decoration: underline; /* Adiciona o sublinhado*/
        color: aqua; /* Muda a cor */
       }




    .fundo {/* Container dos cards*/
        display: flex; /* Ativa Flexbox (Lado a lado)*/
        gap: 10px; /* Espaço entre os cards*/
        width: 100%;/* Ocupa toda a largura*/
        height: 100%; /* Ocupa toda a altura*/
        flex-wrap: wrap; /* Permite quebrar linhas*/
        justify-content: space-around; /* Distribui os cards*/
        margin-top: 10px; /* Espaço acima*/
    }

    .card { /* Card individual*/
        width: 300px; /* Largura fixa*/
        height: 350px; /* Altura fixa*/
        background-color: rgb(66, 143, 215); /* Cor do card */
        align-items: center; /* centraliza conteúdo*/
        text-align: center; /* Centraliza texto*/
        margin: 30px; /* Espaço  lateral e horizontal */
        color: rgb(5, 5, 20); /* Cor da letra*/
        border-radius: 15px; /* Cantos arredondados*/
        padding: 10px; /* espaço interno*/
    }

    .card img {
        width: 100%;
        height: 80%;
        object-fit: cover;
        border-radius: 15px;       
    }

     .card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgb(45, 56, 56);
      box-shadow: 0 15px 20px rgb(60, 42, 42);
      background-image: url(https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExY3RsaHJpam1hbjE2OGszN3E2cnd6cTltZjQ2NmRwdHNvMXUzcGRsdCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/MyWrJJIdAfoJuEPlLP/giphy.webp);
     }

     .subtitulo {
        text-align: center;
     }
      

    </style>
    <!--Aqui termina o css-->
</head>
